
<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <div class="bot-icon">🤖</div>

    <div class="header-info">
      <h2>Learning AI Assistant</h2>
      <p>Powered by Ollama - llama3.2</p>
    </div>

    <span class="status">
      <span class="status-dot"></span>
      Local AI
    </span>
  </div>

  <!-- Chat Body -->
  <div class="chat-body">

    <!-- Welcome Message -->
    <div class="message bot-message">
      <div class="avatar">🤖</div>

      <div class="message-content">
        Hello! Welcome to your AI Assistant.
        Ask me anything. I'm ready to help!
      </div>
    </div>

    <!-- Conversation Messages -->
    <ng-container *ngFor="let msg of messages()">

      <div
        class="message"
        [ngClass]="msg.sender === 'user' ? 'user-message' : 'bot-message'">

        <div *ngIf="msg.sender === 'bot'" class="avatar">
          🤖
        </div>

        <div class="message-content">
          {{ msg.text }}
        </div>

        <div *ngIf="msg.sender === 'user'" class="user-avatar">
          You
        </div>

      </div>

    </ng-container>

    <!-- Loading Indicator -->
    <div *ngIf="loading()" class="message bot-message">
      <div class="avatar">🤖</div>

      <div class="message-content typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Debug Counter -->
    <div class="debug-info">
      Messages received: {{ messages().length }}
    </div>

  </div>

  <!-- Chat Footer -->
  <div class="chat-footer">

    <input
      type="text"
      [(ngModel)]="question"
      placeholder="Type your message..."
      (keyup.enter)="sendMessage()"
      [disabled]="loading()"
    />

    <button
      type="button"
      (click)="sendMessage()"
      [disabled]="loading() || !question.trim()">
      Send ➤
    </button>

  </div>

</div>
