<div class="row">
    <div class="col-md-4 offset-md-4 col-sm-6 offset-sm-3">
        <div class="card auth">
            <div class="card-body auth-card">
                <div class="auth-avatar">
                    <img src="https://pluspng.com/img-png/user-png-icon-account-avatar-human-male-man-men-people-person-download-svg-download-png-edit-icon-512.png"
                        alt="user" class="user-image">
                </div>
            <form (submit)="login(userData)">
                    <div class="form-group">
                        <label for="email">Email : </label> <br>
                        <input type="text" name="email" class="form-control" placeholder="Email"
                            [(ngModel)]="userData.email">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="password">Password : </label> <br>
                        <input type="password" name="password" class="form-control" placeholder="********"
                            [(ngModel)]="userData.password">
                        <br><br>
                        <div class="text-center">
                            <input type="submit" class="btn btn-my" value="Login">
                        </div>
                        <br><br>
                        <div class="text-right forget-pass">
                            <a href="/forget-password"><b style="background-color: rgb(236, 225, 225);">Forget Password
                                    ?</b></a>
                        </div>
                    </div>
                </form>
                <div class="text-center sign-up"><b style="color: azure;">
                        Don`t have an account ?<a style="color: rgb(233, 9, 9);" href="/sign-up">Sign Up</a> here.</b>
                </div>
            </div>
        </div>
    </div>
</div>
