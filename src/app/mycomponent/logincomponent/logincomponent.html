
<div class="row">
    <div class="col-md-4 offset-md-4 col-sm-6 offset-sm-3">
        <div class="card auth">
            <div class="card-body auth-card">

                <div class="auth-avatar">
                    <img
                        src="https://pluspng.com/img-png/user-png-icon-account-avatar-human-male-man-men-people-person-download-svg-download-png-edit-icon-512.png"
                        alt="user"
                        class="user-image">
                </div>

                <!-- LOGIN SCREEN -->
                <div *ngIf="!isOtpScreen">

                    <h4 class="text-center">User Login</h4>

                    <form (ngSubmit)="login(userData)">

                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter Email"
                                [(ngModel)]="userData.email"
                                required>
                        </div>

                        <br>

                        <div class="form-group">
                            <label for="password">Password:</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter Password"
                                [(ngModel)]="userData.password"
                                required>
                        </div>

                        <br>

                        <div class="text-center">
                            <button
                                type="submit"
                                class="btn btn-my"
                                [disabled]="isLoading">

                                {{ isLoading ? 'Please wait...' : 'Login' }}

                            </button>
                        </div>

                        <br>

                        <div class="text-right forget-pass">
                            <a href="/forget-password">
                                <b>Forget Password?</b>
                            </a>
                        </div>

                    </form>

                    <div class="text-center sign-up">
                        <b style="color: azure;">
                            Don't have an account?
                            <a style="color: rgb(233, 9, 9);" href="/sign-up">
                                Sign Up
                            </a>
                            here.
                        </b>
                    </div>

                </div>

                <!-- OTP VERIFICATION SCREEN -->
                <div *ngIf="isOtpScreen">

                    <h4 class="text-center">OTP Verification</h4>

                    <p class="text-center">
                        OTP has been sent to your registered mobile number
                        <br>
                        <b>{{ maskedMobile }}</b>
                    </p>

                    <form (ngSubmit)="verifyOtp()">

                        <div class="form-group">
                            <label for="otp">Enter 6-Digit OTP:</label>

                            <input
                                type="text"
                                id="otp"
                                name="otp"
                                class="form-control"
                                placeholder="Enter OTP"
                                maxlength="6"
                                inputmode="numeric"
                                [(ngModel)]="otpData.otp"
                                required>
                        </div>

                        <br>

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-my"
                                [disabled]="isLoading">

                                {{ isLoading ? 'Verifying...' : 'Verify OTP' }}

                            </button>

                        </div>

                        <br>

                        <div class="text-center">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                (click)="backToLogin()">
                                Back to Login
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>
</div>
